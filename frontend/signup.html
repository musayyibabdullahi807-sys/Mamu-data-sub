<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Create Account | MAMU DATA SUB</title>

  <meta
    name="description"
    content="Create your MAMU DATA SUB account"
  >

  <style>
    :root {
      --bg: #080c16;
      --card: #121a2b;
      --card-2: #0e1524;
      --gold: #f5c542;
      --gold-2: #e89b22;
      --text: #ffffff;
      --muted: #9aa6bb;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ff5c6c;
      --success: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          rgba(245, 197, 66, 0.10),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;

      display: flex;
      justify-content: center;

      padding: 24px 16px;
    }

    .signup-wrapper {
      width: 100%;
      max-width: 430px;
    }

    /* BRAND */

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 68px;
      height: 68px;

      margin: 0 auto 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-2)
        );

      color: #111;

      font-size: 24px;
      font-weight: 900;

      box-shadow:
        0 12px 35px rgba(245, 197, 66, 0.22);
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: var(--gold);
    }

    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    /* CARD */

    .signup-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.015)
        ),
        var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 24px 20px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .signup-card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-bottom: 17px;

      padding: 12px 13px;

      border-radius: 12px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;

      color: #ffb5bd;

      background:
        rgba(255, 92, 108, 0.09);

      border:
        1px solid rgba(255, 92, 108, 0.20);
    }

    .message.success {
      display: block;

      color: #a8f5c8;

      background:
        rgba(37, 211, 102, 0.08);

      border:
        1px solid rgba(37, 211, 102, 0.18);
    }

    /* FORM */

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      color: #dce3ef;

      font-size: 13px;
      font-weight: 700;
    }

    .optional {
      color: #68748a;
      font-size: 11px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 17px;

      opacity: 0.75;

      pointer-events: none;
    }

    input {
      width: 100%;

      height: 51px;

      padding:
        0 45px 0 44px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      outline: none;

      background: var(--card-2);

      color: var(--text);

      font-size: 15px;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: #68748a;
    }

    input:focus {
      border-color:
        rgba(245, 197, 66, 0.7);

      box-shadow:
        0 0 0 3px
        rgba(245, 197, 66, 0.09);
    }

    .password-toggle {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      padding: 5px;
    }

    /* PASSWORD HINT */

    .password-hint {
      margin-top: 7px;

      color: #68748a;

      font-size: 11px;
    }

    /* CREATE BUTTON */

    .signup-btn {
      width: 100%;

      height: 53px;

      margin-top: 5px;

      border: 0;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-2)
        );

      color: #111;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 12px 30px
        rgba(245, 197, 66, 0.16);

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .signup-btn:active {
      transform: scale(0.98);
    }

    .signup-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;

      gap: 12px;

      margin: 23px 0;
    }

    .divider span {
      flex: 1;

      height: 1px;

      background: var(--border);
    }

    .divider p {
      color: #68748a;
      font-size: 12px;
    }

    /* LOGIN */

    .login-text {
      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .login-text a {
      color: var(--gold);

      text-decoration: none;

      font-weight: 800;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 19px;

      color: #58657a;

      font-size: 11px;
    }

    /* SPINNER */

    .spinner {
      width: 18px;
      height: 18px;

      display: inline-block;

      border:
        2px solid rgba(17,17,17,0.3);

      border-top-color: #111;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;

      vertical-align: middle;

      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 16px 12px;
      }

      .signup-card {
        padding: 21px 16px;
      }

      .brand-logo {
        width: 62px;
        height: 62px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="signup-wrapper">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-logo">
        M
      </div>

      <h1>
        MAMU <span>DATA SUB</span>
      </h1>

      <p>
        Smart data, airtime & bills
      </p>

    </div>


    <!-- SIGNUP CARD -->

    <section class="signup-card">

      <h2>
        Create account 🚀
      </h2>

      <p class="subtitle">
        Create your MAMU DATA SUB account and get started.
      </p>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- FORM -->

      <form id="signupForm">

        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              👤
            </span>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              maxlength="80"
              required
            >

          </div>

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone number
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              📱
            </span>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter your phone number"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="15"
              required
            >

          </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
            <span class="optional">
              (optional)
            </span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              ✉️
            </span>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>

          <p class="password-hint">
            Password must contain at least 6 characters.
          </p>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔐
            </span>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="toggleConfirmPassword"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- REFERRAL -->

        <div class="form-group">

          <label for="referralCode">
            Referral code
            <span class="optional">
              (optional)
            </span>
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🎁
            </span>

            <input
              type="text"
              id="referralCode"
              name="referralCode"
              placeholder="Enter referral code"
              maxlength="30"
              autocomplete="off"
            >

          </div>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="signup-btn"
          id="signupBtn"
        >
          Create account
        </button>

      </form>


      <!-- DIVIDER -->

      <div class="divider">

        <span></span>

        <p>OR</p>

        <span></span>

      </div>


      <!-- LOGIN -->

      <p class="login-text">

        Already have an account?

        <a href="./login.html">
          Login
        </a>

      </p>

    </section>


    <!-- FOOTER -->

    <div class="footer">
      © 2026 MAMU DATA SUB
    </div>

  </main>


  <script>

    const API_BASE = "/api";


    const signupForm =
      document.getElementById("signupForm");

    const nameInput =
      document.getElementById("name");

    const phoneInput =
      document.getElementById("phone");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const referralInput =
      document.getElementById("referralCode");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    /*
     * If already logged in,
     * go to the dashboard.
     */

    const existingToken =
      localStorage.getItem("mamu_token");

    if (existingToken) {

      window.location.href =
        "./index.html";

    }


    /*
     * Show / hide password
     */

    document
      .getElementById("togglePassword")
      .addEventListener(
        "click",
        () => {

          const isPassword =
            passwordInput.type === "password";

          passwordInput.type =
            isPassword
              ? "text"
              : "password";

          document
            .getElementById("togglePassword")
            .textContent =
              isPassword
                ? "🙈"
                : "👁️";

        }
      );


    /*
     * Show / hide confirm password
     */

    document
      .getElementById("toggleConfirmPassword")
      .addEventListener(
        "click",
        () => {

          const isPassword =
            confirmPasswordInput.type === "password";

          confirmPasswordInput.type =
            isPassword
              ? "text"
              : "password";

          document
            .getElementById("toggleConfirmPassword")
            .textContent =
              isPassword
                ? "🙈"
                : "👁️";

        }
      );


    /*
     * Message helper
     */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        `message ${type}`;

    }


    /*
     * Signup
     */

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const name =
          nameInput.value.trim();

        const phone =
          phoneInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;

        const referralCode =
          referralInput.value.trim();


        /*
         * Basic validation
         */

        if (!name) {

          showMessage(
            "Please enter your full name."
          );

          nameInput.focus();

          return;

        }


        if (!phone) {

          showMessage(
            "Please enter your phone number."
          );

          phoneInput.focus();

          return;

        }


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters."
          );

          passwordInput.focus();

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match."
          );

          confirmPasswordInput.focus();

          return;

        }


        /*
         * Loading state
         */

        signupBtn.disabled = true;

        signupBtn.innerHTML =
          `<span class="spinner"></span>Creating account...`;

        message.style.display = "none";


        try {

          /*
           * Build request
           */

          const requestBody = {
            name,
            phone,
            password
          };


          /*
           * Email is optional.
           */

          if (email) {

            requestBody.email =
              email;

          }


          /*
           * Referral code is optional.
           */

          if (referralCode) {

            requestBody.referralCode =
              referralCode.toUpperCase();

          }


          /*
           * Send signup request
           */

          const response =
            await fetch(
              `${API_BASE}/auth/signup`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(requestBody)
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.success) {

            throw new Error(
              data.message ||
              "Unable to create account."
            );

          }


          /*
           * Save JWT
           */

          if (data.token) {

            localStorage.setItem(
              "mamu_token",
              data.token
            );

          }


          /*
           * Save returned user
           */

          if (data.user) {

            localStorage.setItem(
              "mamu_user",
              JSON.stringify(data.user)
            );

          }


          showMessage(
            "Account created successfully. Opening your account...",
            "success"
          );


          /*
           * Go to dashboard
           */

          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 600);


        } catch (error) {

          console.error(
            "Signup error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to create account. Please try again."
          );


          signupBtn.disabled = false;

          signupBtn.textContent =
            "Create account";

        }

      }
    );

  </script>

</body>
</html>
