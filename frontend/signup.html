<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Create Account | MAMU DATA SUB</title>

  <style>
    :root {
      --black: #050507;
      --black-soft: #0d0d12;
      --white: #ffffff;
      --gray-bg: #f5f5f7;
      --gray: #8b8d95;
      --border: #dedee3;
      --danger: #c92f3b;
      --success: #15834a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--gray-bg);
      color: var(--black);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: var(--white);
    }

    /* =========================
       BLACK HEADER
       ========================= */

    .hero {
      position: relative;
      height: 245px;
      background:
        radial-gradient(
          circle at 50% 0%,
          #22222a 0%,
          var(--black) 58%
        );

      color: white;
      padding: 28px 22px 0;
      overflow: hidden;
    }

    .hero-content {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: white;
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .brand-sub {
      color: #a7a7af;
      font-size: 10px;
      margin-top: 2px;
    }

    .secure {
      color: #a7a7af;
      font-size: 10px;
      font-weight: 600;
    }

    .hero-title {
      margin-top: 38px;
    }

    .hero-title h1 {
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .hero-title p {
      margin-top: 9px;
      color: #a7a7af;
      font-size: 13px;
      line-height: 1.5;
      max-width: 330px;
    }

    /* =========================
       WAVE
       ========================= */

    .wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      width: 100%;
      height: 82px;
      display: block;
    }

    /* =========================
       CONTENT
       ========================= */

    .content {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 20px 30px;
      margin-top: -1px;
      position: relative;
      z-index: 2;
    }

    .signup-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 21px;
      box-shadow:
        0 16px 45px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       MESSAGE
       ========================= */

    .message {
      display: none;
      padding: 12px 13px;
      border-radius: 12px;
      margin-bottom: 17px;
      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      color: var(--danger);
      background: #fff1f2;
      border: 1px solid #ffd5d8;
    }

    .message.success {
      display: block;
      color: var(--success);
      background: #eefaf4;
      border: 1px solid #ccebd9;
    }

    /* =========================
       FORM
       ========================= */

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 750;
    }

    .optional {
      color: var(--gray);
      font-size: 11px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #fafafa;
      color: var(--black);
      font-size: 15px;
      padding: 0 15px;
      transition: 0.2s;
    }

    input::placeholder {
      color: #a0a1a8;
    }

    input:focus {
      border-color: var(--black);
      background: white;
      box-shadow:
        0 0 0 3px rgba(5, 5, 7, 0.06);
    }

    .phone-prefix {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 700;
      color: #777982;
      pointer-events: none;
    }

    .phone-input {
      padding-left: 53px;
    }

    /* =========================
       EYE BUTTON
       ========================= */

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 10px;

      background: #eeeeF1;
      color: #15151a;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .eye-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .password-input {
      padding-right: 58px;
    }

    .hint {
      margin-top: 7px;
      color: var(--gray);
      font-size: 11px;
    }

    /* =========================
       BUTTON
       ========================= */

    .signup-btn {
      width: 100%;
      height: 54px;
      margin-top: 3px;

      border: 0;
      border-radius: 15px;

      background: var(--black);
      color: white;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .signup-btn:active {
      transform: scale(0.98);
    }

    .signup-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* =========================
       SPINNER
       ========================= */

    .spinner {
      width: 16px;
      height: 16px;
      display: inline-block;

      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
      vertical-align: middle;

      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       LOGIN
       ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 23px 0;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider p {
      color: var(--gray);
      font-size: 11px;
      font-weight: 700;
    }

    .login-box {
      text-align: center;
      color: var(--gray);
      font-size: 13px;
    }

    .login-box a {
      color: var(--black);
      font-weight: 800;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      color: #a2a3a9;
      font-size: 10px;
      margin-top: 20px;
    }

    @media (max-width: 380px) {
      .hero {
        height: 235px;
        padding-left: 17px;
        padding-right: 17px;
      }

      .content {
        padding-left: 15px;
        padding-right: 15px;
      }

      .signup-card {
        padding: 18px;
      }

      .hero-title h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
       ========================= -->

  <section class="hero">

    <div class="hero-content">

      <div class="top-row">

        <div class="brand">

          <div class="brand-mark">
            M
          </div>

          <div>
            <div class="brand-name">
              MAMU DATA SUB
            </div>

            <div class="brand-sub">
              Smart data and digital services
            </div>
          </div>

        </div>

        <div class="secure">
          Secure account
        </div>

      </div>


      <div class="hero-title">

        <h1>
          Create your account
        </h1>

        <p>
          Register to manage data, airtime and digital services.
        </p>

      </div>

    </div>


    <!-- WAVE -->

    <svg
      class="wave"
      viewBox="0 0 1440 160"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        d="M0,70 C260,155 430,155 720,80 C1010,5 1180,5 1440,70 L1440,160 L0,160 Z"
        fill="#ffffff"
      />
    </svg>

  </section>


  <!-- =========================
       CONTENT
       ========================= -->

  <main class="content">

    <section class="signup-card">

      <div
        id="message"
        class="message"
      ></div>


      <form id="signupForm">

        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="80"
            required
          >

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone number
          </label>

          <div class="input-wrap">

            <span class="phone-prefix">
              +234
            </span>

            <input
              type="tel"
              id="phone"
              name="phone"
              class="phone-input"
              placeholder="8012345678"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="15"
              required
            >

          </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email
            <span class="optional">
              (optional)
            </span>
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="password"
              name="password"
              class="password-input"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="eye-btn"
              id="togglePassword"
              aria-label="Show password"
            >

              <svg
                id="passwordEye"
                viewBox="0 0 24 24"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>

            </button>

          </div>

          <div class="hint">
            Use at least 6 characters.
          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="password-input"
              placeholder="Enter your password again"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="eye-btn"
              id="toggleConfirmPassword"
              aria-label="Show password"
            >

              <svg
                id="confirmPasswordEye"
                viewBox="0 0 24 24"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>

            </button>

          </div>

        </div>


        <!-- REFERRAL -->

        <div class="form-group">

          <label for="referralCode">
            Referral code
            <span class="optional">
              (optional)
            </span>
          </label>

          <input
            type="text"
            id="referralCode"
            name="referralCode"
            placeholder="Enter referral code"
            maxlength="30"
            autocomplete="off"
          >

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="signup-btn"
          id="signupBtn"
        >
          Create account
        </button>

      </form>


      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>


      <div class="login-box">

        Already have an account?

        <a href="./login.html">
          Log in
        </a>

      </div>

    </section>


    <div class="footer">
      © 2026 MAMU DATA SUB
    </div>

  </main>


  <script src="./js/signup.js"></script>

</body>
</html>
