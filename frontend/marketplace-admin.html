<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <script>try{if(localStorage.getItem("mamu_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(_){}</script>
  <title>Marketplace Admin | MAMU</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body{background:#f6f8fc;color:#111827;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.admin-wrap{max-width:900px;margin:auto;padding:18px 16px 50px}.admin-head{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,#1d4ed8,#2563eb);border-radius:18px;color:white}.admin-head a{color:white;text-decoration:none;font-size:26px}.admin-head h1{font-size:21px}.admin-head p{font-size:12px;color:#dbeafe;margin-top:3px}.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0}.toolbar select,.toolbar button{font:inherit;border-radius:10px;padding:11px 13px;border:1px solid #dbe2ef;background:white;color:#111827}.toolbar button{background:#2563eb;color:white;border:0;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.application{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.stat span{display:block;color:#64748b;font-size:12px}.stat strong{display:block;font-size:22px;margin-top:5px}.application{margin-top:12px}.application-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.application h2{font-size:17px}.badge{font-size:11px;font-weight:800;text-transform:uppercase;border-radius:99px;padding:5px 9px;background:#eff6ff;color:#1d4ed8}.badge.approved{background:#ecfdf5;color:#15803d}.badge.rejected,.badge.suspended{background:#fff1f2;color:#be123c}.details{color:#475569;font-size:13px;line-height:1.55;margin:10px 0}.history{border-top:1px solid #e5e7eb;padding-top:10px;margin-top:10px}.history h3{font-size:13px;margin:0 0 6px}.history p{font-size:12px;color:#64748b;margin:5px 0}.review-note{width:100%;border:1px solid #dbe2ef;border-radius:9px;padding:10px;font:inherit;margin:5px 0 9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 12px;background:#2563eb;color:white;font-weight:700}.actions button.reject{background:#be123c}.actions button.suspend{background:#475569}.status{padding:22px;text-align:center;color:#64748b}.error{color:#be123c}.hidden{display:none!important}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.application-head{align-items:start}}
    :root[data-theme="dark"] body{background:#0b1220;color:#e5e7eb}
    :root[data-theme="dark"] .stat,:root[data-theme="dark"] .application{background:#111c2e;border-color:#29364a;color:#e5e7eb}
    :root[data-theme="dark"] .details,:root[data-theme="dark"] .status,:root[data-theme="dark"] .application p{color:#a0aec0}
    :root[data-theme="dark"] .review-note,:root[data-theme="dark"] #user-search{background:#0f1929;color:#e5e7eb;border-color:#29364a}
    :root[data-theme="dark"] .toolbar select,:root[data-theme="dark"] .toolbar input{background:#0f1929;color:#e5e7eb;border-color:#29364a}
    :root[data-theme="dark"] .history{border-color:#29364a}
  </style>
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-head"><a href="/index.html" aria-label="Back to MAMU">‹</a><div><h1>MAMU Marketplace Admin</h1><p>Review business applications and their history</p></div></header>
    <div class="toolbar"><select id="status-filter" aria-label="Filter applications"><option value="all">All applications</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="suspended">Suspended</option></select><button id="reload">Refresh applications</button></div>
    <section class="stats"><div class="stat"><span>Total</span><strong id="count-all">—</strong></div><div class="stat"><span>Pending</span><strong id="count-pending">—</strong></div><div class="stat"><span>Approved</span><strong id="count-approved">—</strong></div><div class="stat"><span>Rejected</span><strong id="count-rejected">—</strong></div></section>
    <section id="applications" aria-live="polite"><div class="status">Loading business applications...</div></section>
    <header style="margin-top:30px"><h2>Registered app users</h2><p style="color:#64748b;font-size:13px">New registrations appear here automatically.</p></header>
    <div class="toolbar"><input id="user-search" type="search" placeholder="Search name, phone, or email" aria-label="Search users" style="flex:1;font:inherit;border-radius:10px;padding:11px 13px;border:1px solid #dbe2ef"><button id="users-reload">Refresh users</button></div>
    <div class="stat" style="margin-bottom:12px"><span>Total registered users</span><strong id="users-total">—</strong></div>
    <section id="registered-users" aria-live="polite"><div class="status">Loading registered users...</div></section>
    <div class="toolbar" style="justify-content:space-between"><button id="users-prev">Previous</button><span id="users-page" style="color:#64748b"></span><button id="users-next">Next</button></div>
  </main>
  <script src="/js/marketplace-admin.js"></script>
</body>
</html>
