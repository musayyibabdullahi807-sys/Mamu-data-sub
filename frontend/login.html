<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Login | MAMU DATA SUB</title>

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray: #777777;
      --light-gray: #eeeeee;
      --border: #dddddd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      min-height: 100vh;
      background: var(--white);
      color: var(--black);
    }

    .page {
      min-height: 100vh;
      overflow: hidden;
    }

    /* BLACK HEADER */

    .top-section {
      position: relative;
      min-height: 330px;

      background: var(--black);
      color: var(--white);

      padding: 48px 20px 115px;

      text-align: center;
      overflow: hidden;
    }

    /* CENTERED LOGO */

    .brand-logo {
      width: 76px;
      height: 76px;

      margin: 0 auto 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid var(--white);
      border-radius: 22px;

      background: var(--black);
      color: var(--white);

      font-size: 30px;
      font-weight: 900;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .brand p {
      margin-top: 8px;

      color: #aaaaaa;

      font-size: 13px;
    }

    /* CURVED WAVE */

    .wave {
      position: absolute;

      left: 0;
      bottom: -1px;

      width: 100%;
      height: 105px;

      display: block;
    }

    /* LOGIN AREA */

    .login-area {
      position: relative;
      z-index: 5;

      width: 100%;
      max-width: 430px;

      margin: -55px auto 0;

      padding: 0 18px 30px;
    }

    .login-card {
      background: var(--white);

      border-radius: 26px;

      padding: 28px 21px 24px;

      border: 1px solid #f0f0f0;

      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.12);
    }

    .login-card h2 {
      font-size: 23px;
      font-weight: 900;

      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--gray);

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 25px;
    }

    /* MESSAGE */

    .message {
      display: none;

      padding: 12px 13px;
      margin-bottom: 17px;

      border-radius: 12px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.error,
    .message.success {
      color: var(--black);
      background: #f3f3f3;
      border: 1px solid #d8d8d8;
    }

    /* FORM */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      font-size: 13px;
      font-weight: 800;

      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      height: 53px;

      padding: 0 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: #fafafa;
      color: var(--black);

      outline: none;

      font-size: 15px;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    .input-wrapper input:focus {
      background: var(--white);

      border-color: var(--black);

      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.08);
    }

    .input-wrapper input::placeholder {
      color: #999999;
    }

    /* PASSWORD */

    .password-wrapper input {
      padding-right: 65px;
    }

    .password-toggle {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 48px;
      height: 40px;

      border: 0;
      background: transparent;

      color: var(--black);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* EYE ICON */

    .eye {
      position: relative;

      width: 22px;
      height: 14px;

      border: 2px solid var(--black);

      border-radius: 80% 20%;

      transform: rotate(45deg);
    }

    .eye::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 5px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: var(--black);

      border-radius: 50%;
    }

    .eye.off::before {
      content: "";

      position: absolute;

      width: 27px;
      height: 2px;

      left: -5px;
      top: 5px;

      background: var(--black);

      transform: rotate(-45deg);

      z-index: 3;
    }

    /* LOGIN BUTTON */

    .login-btn {
      width: 100%;
      height: 54px;

      margin-top: 6px;

      border: 0;
      border-radius: 14px;

      background: var(--black);
      color: var(--white);

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* DIVIDER */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin: 25px 0 21px;
    }

    .divider span {
      flex: 1;

      height: 1px;

      background: var(--light-gray);
    }

    .divider p {
      color: var(--gray);

      font-size: 11px;
      font-weight: 800;
    }

    /* SIGNUP */

    .signup-text {
      text-align: center;

      color: var(--gray);

      font-size: 14px;
    }

    .signup-text a {
      color: var(--black);

      font-weight: 900;

      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      color: #999999;

      font-size: 11px;

      padding: 0 0 25px;
    }

    /* MOBILE */

    @media (max-width: 360px) {
      .top-section {
        min-height: 305px;
        padding-top: 40px;
      }

      .brand-logo {
        width: 66px;
        height: 66px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .login-area {
        margin-top: -48px;
      }

      .login-card {
        padding: 23px 17px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="top-section">

      <div class="brand-logo">
        M
      </div>

      <div class="brand">
        <h1>MAMU DATA SUB</h1>

        <p>
          Smart data, airtime & bills
        </p>
      </div>

      <svg
        class="wave"
        viewBox="0 0 1440 160"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0,70 C260,155 430,155 720,80 C1010,5 1180,5 1440,70 L1440,160 L0,160 Z"
          fill="#ffffff"
        />
      </svg>

    </section>


    <section class="login-area">

      <div class="login-card">

        <h2>Welcome back</h2>

        <p class="subtitle">
          Login to continue to your account.
        </p>


        <div
          id="message"
          class="message"
        ></div>


        <form id="loginForm">

          <div class="form-group">

            <label for="phone">
              Phone number
            </label>

            <div class="input-wrapper">

              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
                inputmode="numeric"
                required
              >

            </div>

          </div>


          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="input-wrapper password-wrapper">

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show password"
              >
                <span
                  class="eye off"
                  id="passwordEye"
                ></span>
              </button>

            </div>

          </div>


          <button
            type="submit"
            class="login-btn"
            id="loginBtn"
          >
            Login
          </button>

        </form>


        <div class="divider">

          <span></span>

          <p>OR</p>

          <span></span>

        </div>


        <p class="signup-text">

          Don't have an account?

          <a href="./signup.html">
            Create account
          </a>

        </p>

      </div>


      <div class="footer">
        © 2026 MAMU DATA SUB
      </div>

    </section>

  </main>


  <script src="./js/login.js"></script>

  <script>
    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    const passwordEye =
      document.getElementById("passwordEye");

    if (
      togglePassword &&
      passwordInput &&
      passwordEye
    ) {
      togglePassword.addEventListener(
        "click",
        () => {

          const isHidden =
            passwordInput.type === "password";

          passwordInput.type =
            isHidden ? "text" : "password";

          passwordEye.classList.toggle(
            "off",
            !isHidden
          );

          togglePassword.setAttribute(
            "aria-label",
            isHidden
              ? "Hide password"
              : "Show password"
          );

        }
      );
    }
  </script>

<style>
  .whatsapp-support {
    position: fixed;
    right: 18px;
    bottom: 18px;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #25D366;
    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);

    z-index: 9999;

    transition: transform 0.2s ease;
  }

  .whatsapp-support:hover {
    transform: scale(1.08);
  }

  .whatsapp-support:active {
    transform: scale(0.94);
  }

  .whatsapp-support svg {
    width: 31px;
    height: 31px;
  }
</style>

</body>
</html>
