<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Login | MAMU DATA SUB</title>

  <meta
    name="description"
    content="Login to your MAMU DATA SUB account"
  >

  <style>
    :root {
      --bg: #080c16;
      --card: #121a2b;
      --card-2: #0e1524;
      --gold: #f5c542;
      --gold-2: #e89b22;
      --text: #ffffff;
      --muted: #9aa6bb;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ff5c6c;
      --success: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          rgba(245, 197, 66, 0.10),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    /* LOGO */

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-2)
        );

      color: #111;

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 12px 35px rgba(245, 197, 66, 0.22);
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: var(--gold);
    }

    .brand p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* CARD */

    .login-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.035),
          rgba(255,255,255,0.015)
        ),
        var(--card);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 25px 20px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .login-card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .login-card .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 700;

      color: #dce3ef;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      font-size: 17px;

      opacity: 0.75;

      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;

      height: 52px;

      padding:
        0 48px 0 45px;

      border-radius: 14px;

      border: 1px solid var(--border);

      background: var(--card-2);

      color: var(--text);

      outline: none;

      font-size: 15px;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    .input-wrapper input::placeholder {
      color: #68748a;
    }

    .input-wrapper input:focus {
      border-color: rgba(245, 197, 66, 0.7);

      box-shadow:
        0 0 0 3px rgba(245, 197, 66, 0.09);

      background: #111a2b;
    }

    .password-toggle {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: var(--muted);

      font-size: 18px;

      cursor: pointer;

      padding: 5px;
    }

    /* BUTTON */

    .login-btn {
      width: 100%;

      height: 53px;

      margin-top: 7px;

      border: 0;
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold-2)
        );

      color: #111;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 12px 30px rgba(245, 197, 66, 0.16);

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-bottom: 17px;

      padding: 12px 13px;

      border-radius: 12px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.error {
      display: block;

      color: #ffb5bd;

      background: rgba(255, 92, 108, 0.09);

      border: 1px solid rgba(255, 92, 108, 0.2);
    }

    .message.success {
      display: block;

      color: #a8f5c8;

      background: rgba(37, 211, 102, 0.08);

      border: 1px solid rgba(37, 211, 102, 0.18);
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 24px 0;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider p {
      color: #68748a;
      font-size: 12px;
    }

    /* SIGNUP */

    .signup-text {
      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .signup-text a {
      color: var(--gold);

      text-decoration: none;

      font-weight: 800;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #58657a;

      font-size: 11px;
    }

    /* LOADING */

    .spinner {
      width: 18px;
      height: 18px;

      display: inline-block;

      border: 2px solid rgba(17,17,17,0.3);
      border-top-color: #111;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;

      vertical-align: middle;

      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* SMALL SCREEN */

    @media (max-width: 360px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 21px 16px;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand-logo {
        width: 64px;
        height: 64px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <!-- BRAND -->
    <div class="brand">

      <div class="brand-logo">
        M
      </div>

      <h1>
        MAMU <span>DATA SUB</span>
      </h1>

      <p>
        Smart data, airtime & bills
      </p>

    </div>


    <!-- LOGIN CARD -->
    <section class="login-card">

      <h2>
        Welcome back 👋
      </h2>

      <p class="subtitle">
        Login to continue to your account.
      </p>


      <!-- MESSAGE -->
      <div
        id="message"
        class="message"
      ></div>


      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- PHONE -->
        <div class="form-group">

          <label for="phone">
            Phone number
          </label>

          <div class="input-wrapper">

            <span class="icon">
              📱
            </span>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter your phone number"
              autocomplete="tel"
              inputmode="numeric"
              required
            >

          </div>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Login
        </button>

      </form>


      <!-- DIVIDER -->
      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>


      <!-- SIGNUP -->
      <p class="signup-text">

        Don't have an account?

        <a href="./signup.html">
          Create account
        </a>

      </p>

    </section>


    <!-- FOOTER -->
    <div class="footer">
      © 2026 MAMU DATA SUB
    </div>

  </main>

<script src="./js/login.js"></script>  

</body>
</html>
